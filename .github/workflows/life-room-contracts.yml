name: Life Room contracts
on:
  pull_request:
    paths:
      - "cloudflare/life-control-room/**"
      - ".github/workflows/life-room-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare/life-control-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser JS syntax, API contracts, privacy and ZIP
        run: npm test
